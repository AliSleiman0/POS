# Render Blueprint. Apply from the dashboard: New → Blueprint → pick this repo.
#
# Three resources: the API (a Docker web service), the web app (a static site) and
# Postgres. Deliberately not one service serving both — a frontend deploy must not
# restart the backend, and the static site is on a CDN that does not sleep.
#
# NOTHING SECRET IS IN THIS FILE. Values marked `sync: false` are set once in the
# dashboard and never committed; see docs/RUNBOOK.md for the list.
#
# ── Two limitations of the free plan, recorded rather than discovered ────────────
#
# 1. A free web service SLEEPS after ~15 minutes idle and takes roughly a minute to
#    wake. That is fine for verifying a deployment and unacceptable for a real till —
#    a customer at a counter will not wait a minute. Moving the API to a paid instance
#    is the single change that makes this production-viable, and it is why
#    `plan: free` is written here rather than assumed.
# 2. A free Postgres is DELETED 30 days after creation, with a 14-day grace period.
#    Back it up before then, or upgrade. See docs/RUNBOOK.md § Restoring from backup.

services:
  # ───────────────────────────────────────────────────────────────── API
  - name: pos-api
    type: web
    runtime: docker
    plan: free
    region: frankfurt # Closest offered to the Irish tenants; latency is felt at a till.

    # Built from the repository root, because Directory.Build.props,
    # Directory.Packages.props and the Pos.Core/Pos.Data projects all live above
    # src/Pos.Api. A context of src/Pos.Api cannot see any of them.
    dockerfilePath: ./src/Pos.Api/Dockerfile
    dockerContext: .

    # Readiness, not liveness. This checks the database AND that the connection
    # cannot bypass row-level security, so a machine connected as a superuser is
    # never given traffic — see RowLevelSecurityHealthCheck.
    healthCheckPath: /health/ready

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Render terminates TLS at its edge and forwards plain HTTP with
      # X-Forwarded-Proto. Without this the app runs UseHttpsRedirection, sees
      # "http", and answers 307 to the URL the caller was already on — every request
      # loops, the API serves nothing, and the instance stays up and healthy
      # throughout. See TlsTerminationTests.
      - key: Hosting__BehindTlsTerminatingProxy
        value: "true"

      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"

      # NOT fromDatabase. Render's generated connection string authenticates as the
      # database owner, and the application must connect as `pos_app` — NOBYPASSRLS,
      # no CREATE on the schema. Connecting as the owner leaves every RLS policy
      # inert while pg_policies still lists it as enabled, which is the one
      # misconfiguration that silently crosses a tenant boundary.
      #
      # Set by hand after creating that role. Either the URI or Npgsql keyword form
      # is accepted — see PostgresConnectionString.
      - key: ConnectionStrings__Postgres
        sync: false

      # Generated by Render and never seen by anybody. If the instance refuses to
      # start complaining about key length, the generated value was shorter than the
      # 32 bytes JwtOptions requires — set it by hand to 48 random bytes instead.
      - key: Jwt__SigningKey
        generateValue: true

      - key: Jwt__Issuer
        value: https://pos-api.onrender.com
      - key: Jwt__Audience
        value: https://pos-api.onrender.com

      # MUST name the static site's origin exactly. An empty list in Production
      # refuses to boot, deliberately: a CORS mistake is invisible from the server,
      # which keeps answering healthily while the browser blocks every call.
      - key: Cors__AllowedOrigins__0
        value: https://pos-web.onrender.com

      # Error tracking. Absent means the SDK is inert, which is why Development and
      # the tests need no second switch.
      - key: Sentry__Dsn
        sync: false

  # ───────────────────────────────────────────────────────── Web (static)
  - name: pos-web
    type: web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./src/Pos.Web/dist

    envVars:
      # Vite inlines VITE_* at BUILD time, so this is baked into the bundle and
      # changing it means rebuilding, not restarting. Nothing secret may ever go in a
      # VITE_* variable for the same reason: it is published to every browser.
      #
      # Must match the API's origin, and the API's Cors__AllowedOrigins__0 must match
      # this site's. They are a matched set — get one wrong and the browser blocks
      # every call with the API reporting perfectly healthy.
      - key: VITE_API_BASE_URL
        value: https://pos-api.onrender.com

    routes:
      # SPA fallback. React Router owns /register, /admin/settings and the rest, so a
      # reload on any of them must serve index.html rather than 404 — CLAUDE.md
      # invariant 11: a tablet on a counter gets reloaded, and reloading is the only
      # remedy a shop floor has.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Hashed filenames are immutable by construction — a change produces a
      # different name — so cache them hard. This is most of what makes a reload on a
      # shop's connection fast.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # index.html is the opposite: it names the hashed bundles, so a cached copy
      # pins the whole app to an old version and a deploy reaches nobody.
      - path: /index.html
        name: Cache-Control
        value: no-cache

      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer

      # A shared counter tablet needs none of these, and a POS is a plausible target
      # for a page that would like one.
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()

      # The refresh token lives in sessionStorage (DECISIONS.md, Phase 4.2), readable
      # by any injected script — so `connect-src` naming the API and nothing else is
      # the control that remains: a token that cannot be sent anywhere is much less
      # useful than one that can.
      #
      # style-src allows 'unsafe-inline', which is a real and deliberate weakening.
      # base-ui's primitives set inline positioning styles that no hash or nonce
      # covers without a build-time transform this project does not have. script-src
      # stays strict, and an injected style cannot read sessionStorage.
      #
      # CHANGE connect-src WITH THE API ORIGIN, or the browser blocks every call.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://pos-api.onrender.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"

databases:
  - name: pos-db
    plan: free
    region: frankfurt

    # The role migrations run as. The application does NOT use it — see the
    # ConnectionStrings__Postgres note above.
    databaseName: pos
    user: pos_owner
