# The API. Deployed with `fly deploy --config fly.toml`.
#
# The web app is a SEPARATE Fly app (src/Pos.Web/fly.toml) serving static assets.
# Deliberately not served by this one: they have different scaling and caching
# characteristics, and putting the SPA behind the API means a frontend deploy
# restarts the backend — a cashier mid-sale pays for a CSS change.
#
# Nothing secret is in this file. Secrets are set with `fly secrets set`, which
# stores them encrypted and injects them as environment variables at run time;
# see docs/RUNBOOK.md for the list.

app = "pos-api"
primary_region = "dub"           # Dublin: the tenants are Irish, and latency at a till is felt.

[build]
  dockerfile = "src/Pos.Api/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"

  # Fly terminates TLS at its edge and forwards plain HTTP with X-Forwarded-Proto.
  # Without this the app runs UseHttpsRedirection, sees "http", and answers 307 to the
  # URL the caller was already on — every request loops, the API serves nothing, and
  # the machine stays up and healthy throughout. See Program.cs and TlsTerminationTests.
  Hosting__BehindTlsTerminatingProxy = "true"

  # Bind where the proxy expects. Matches internal_port below and EXPOSE in the Dockerfile.
  ASPNETCORE_HTTP_PORTS = "8080"

[http_service]
  internal_port = 8080
  force_https = true

  # A till must never pay a cold start. Scaling to zero saves a few euro a month and
  # spends it as a five-second pause with a customer waiting at the counter, which is
  # the single most common reason a shop gives up on a POS.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Liveness. Deliberately does NOT touch the database: if Postgres blips we want the
  # proxy to stop sending traffic, not for Fly to kill and restart the machine — a
  # restart cannot fix a database and throws away the connection pool trying.
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/health/live"

  # Readiness, which does check the database. This is the one that decides whether a
  # machine receives requests.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
